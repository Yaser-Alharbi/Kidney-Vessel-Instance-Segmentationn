name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          pip install pylint==4.0.9

      # Floor = whole-repo score after the demo redesign (9.295-9.30 locally, shown as 9.30), rounded down.
      # demo/ itself is held to zero messages; the remaining ones are in src/, scripts/, main.py.
      - name: Pylint
        run: pylint $(git ls-files '*.py') --fail-under=9.29
